[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acentos-ocr"
version = "0.1.0"
description = "Modular OCR pipeline using OpenCV preprocessing, pytesseract, and numpy."
readme = "README.md"
requires-python = ">=3.13"
# SPDX expression per PEP 639. Deliberately not paired with a
# "License :: OSI Approved :: ..." classifier -- setuptools rejects having both.
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "crenaz" }
]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9.0",
  "pytesseract>=0.3.10",
  "pillow>=10.0.0",
  "pandas>=2.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["acentos_ocr*"]

